<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Logs - Sistema Legal Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-container {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            height: 80vh;
            overflow-y: auto;
            padding: 20px;
            border-radius: 5px;
        }
        .log-debug { color: #87ceeb; }
        .log-info { color: #90ee90; }
        .log-warning { color: #ffa500; }
        .log-error { color: #ff6b6b; }
        .log-critical { color: #ff0000; }
        .timestamp { color: #888; }
        .module { color: #ffb347; }
        .auto-scroll {
            position: sticky;
            bottom: 0;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Debug Logs - Sistema Legal Pro</h2>
                    <div>
                        <button id="clearLogs" class="btn btn-warning btn-sm">Limpar Logs</button>
                        <button id="autoRefresh" class="btn btn-success btn-sm">Auto Refresh: ON</button>
                        <button id="exportLogs" class="btn btn-info btn-sm">Exportar</button>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-3">
                        <select id="levelFilter" class="form-select form-select-sm">
                            <option value="">Todos os níveis</option>
                            <option value="DEBUG">DEBUG</option>
                            <option value="INFO">INFO</option>
                            <option value="WARNING">WARNING</option>
                            <option value="ERROR">ERROR</option>
                            <option value="CRITICAL">CRITICAL</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="moduleFilter" class="form-select form-select-sm">
                            <option value="">Todos os módulos</option>
                            <option value="main">main</option>
                            <option value="werkzeug">werkzeug</option>
                            <option value="urllib3">urllib3</option>
                            <option value="sqlalchemy">sqlalchemy</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="searchFilter" class="form-control form-control-sm" placeholder="Buscar nos logs...">
                    </div>
                    <div class="col-md-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="autoScroll" checked>
                            <label class="form-check-label" for="autoScroll">Auto Scroll</label>
                        </div>
                    </div>
                </div>
                
                <div id="logContainer" class="log-container">
                    <div id="logs">Carregando logs...</div>
                </div>
                
                <div class="mt-3">
                    <small class="text-muted">
                        Última atualização: <span id="lastUpdate">--</span> | 
                        Total de logs: <span id="logCount">0</span>
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script>
        class LogViewer {
            constructor() {
                this.autoRefreshEnabled = true;
                this.autoScrollEnabled = true;
                this.logs = [];
                this.filteredLogs = [];
                this.refreshInterval = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.startAutoRefresh();
                this.loadLogs();
            }

            setupEventListeners() {
                document.getElementById('clearLogs').addEventListener('click', () => this.clearLogs());
                document.getElementById('autoRefresh').addEventListener('click', () => this.toggleAutoRefresh());
                document.getElementById('exportLogs').addEventListener('click', () => this.exportLogs());
                document.getElementById('levelFilter').addEventListener('change', () => this.applyFilters());
                document.getElementById('moduleFilter').addEventListener('change', () => this.applyFilters());
                document.getElementById('searchFilter').addEventListener('input', () => this.applyFilters());
                document.getElementById('autoScroll').addEventListener('change', (e) => {
                    this.autoScrollEnabled = e.target.checked;
                });
            }

            async loadLogs() {
                try {
                    const response = await fetch('/debug/logs');
                    const data = await response.json();
                    
                    if (data.success) {
                        this.logs = data.logs;
                        this.applyFilters();
                        this.updateLastUpdate();
                        this.updateLogCount();
                    }
                } catch (error) {
                    console.error('Erro ao carregar logs:', error);
                }
            }

            applyFilters() {
                const levelFilter = document.getElementById('levelFilter').value;
                const moduleFilter = document.getElementById('moduleFilter').value;
                const searchFilter = document.getElementById('searchFilter').value.toLowerCase();

                this.filteredLogs = this.logs.filter(log => {
                    if (levelFilter && log.level !== levelFilter) return false;
                    if (moduleFilter && !log.module.includes(moduleFilter)) return false;
                    if (searchFilter && !log.message.toLowerCase().includes(searchFilter)) return false;
                    return true;
                });

                this.renderLogs();
            }

            renderLogs() {
                const logsContainer = document.getElementById('logs');
                
                if (this.filteredLogs.length === 0) {
                    logsContainer.innerHTML = '<div class="text-center text-muted">Nenhum log encontrado com os filtros aplicados.</div>';
                    return;
                }

                const html = this.filteredLogs.map(log => {
                    const levelClass = `log-${log.level.toLowerCase()}`;
                    return `
                        <div class="log-entry">
                            <span class="timestamp">${log.timestamp}</span> - 
                            <span class="${levelClass}">${log.level}</span> - 
                            <span class="module">${log.module}</span>: 
                            <span class="message">${log.message}</span>
                        </div>
                    `;
                }).join('');

                logsContainer.innerHTML = html;

                if (this.autoScrollEnabled) {
                    const container = document.getElementById('logContainer');
                    container.scrollTop = container.scrollHeight;
                }
            }

            startAutoRefresh() {
                this.refreshInterval = setInterval(() => {
                    if (this.autoRefreshEnabled) {
                        this.loadLogs();
                    }
                }, 2000);
            }

            toggleAutoRefresh() {
                this.autoRefreshEnabled = !this.autoRefreshEnabled;
                const button = document.getElementById('autoRefresh');
                
                if (this.autoRefreshEnabled) {
                    button.textContent = 'Auto Refresh: ON';
                    button.className = 'btn btn-success btn-sm';
                } else {
                    button.textContent = 'Auto Refresh: OFF';
                    button.className = 'btn btn-secondary btn-sm';
                }
            }

            clearLogs() {
                if (confirm('Tem certeza que deseja limpar todos os logs?')) {
                    fetch('/debug/clear-logs', { method: 'POST' })
                        .then(() => {
                            this.logs = [];
                            this.filteredLogs = [];
                            this.renderLogs();
                            this.updateLogCount();
                        });
                }
            }

            exportLogs() {
                const text = this.filteredLogs.map(log => 
                    `${log.timestamp} - ${log.level} - ${log.module}: ${log.message}`
                ).join('\n');
                
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `logs_${new Date().toISOString().split('T')[0]}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            }

            updateLastUpdate() {
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            }

            updateLogCount() {
                document.getElementById('logCount').textContent = this.filteredLogs.length;
            }
        }

        // Inicializar o visualizador de logs
        document.addEventListener('DOMContentLoaded', () => {
            new LogViewer();
        });
    </script>
</body>
</html>
