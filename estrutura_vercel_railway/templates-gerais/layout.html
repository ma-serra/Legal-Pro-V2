<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Jurídico{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --accent-color: #2E5266;
            --text-color: #ffffff;
            --border-color: #404040;
        }
        
        body {
            background-color: var(--primary-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background-color: var(--secondary-color) !important;
            border-bottom: 1px solid var(--border-color);
        }
        
        .content {
            min-height: calc(100vh - 76px);
            padding: 20px 0;
        }
        
        .dropdown-menu {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .dropdown-item {
            color: var(--text-color);
            transition: all 0.3s ease;
            padding: 8px 16px;
        }
        
        .dropdown-item:hover {
            background-color: rgba(74, 144, 226, 0.2);
            color: #ffffff;
            transform: translateX(3px);
        }
        
        .dropdown-item:focus {
            background-color: rgba(74, 144, 226, 0.3);
            color: #ffffff;
        }
        
        .dropdown-divider {
            border-color: var(--border-color);
        }
        
        .nav-link:hover {
            background-color: rgba(74, 144, 226, 0.1);
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .dropdown-item:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header Navigation Universal -->
    {% include 'includes/header_universal.html' %}
    
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="footer mt-5 py-3 bg-dark">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-1">© 2025 Ars Data Science - Todos os Direitos Reservados</p>
                    <p class="mb-0">Email: suporte@arsdatascience.com.br</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="/legal/politica-privacidade" class="text-primary">Política de Privacidade</a>
                    <span class="mx-2">|</span>
                    <a href="/legal/termos-uso" class="text-primary">Termos de Uso</a>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Sistema Universal de Formatação Monetária -->
    <script src="{{ url_for('static', filename='js/currency-formatter.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
