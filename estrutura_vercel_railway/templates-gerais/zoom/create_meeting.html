{% extends 'layout.html' %}

{% block title %}Criar Reunião Zoom{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">
            <i class="fas fa-video me-2 text-primary"></i> Criar Nova Reunião Zoom
        </h1>
        <div class="btn-toolbar">
            <a href="/" class="btn btn-sm btn-outline-light me-2">
                <i class="fas fa-home me-1"></i> Home
            </a>
            <a href="/zoom_api/" class="btn btn-sm btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card bg-dark border-secondary shadow-sm">
                <div class="card-body">
                    <h5 class="card-title mb-4">Dados da Reunião</h5>
                    
                    <form method="post" action="/zoom_api/create_meeting">
                        <div class="mb-3">
                            <label for="topic" class="form-label">Título da Reunião</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="topic" name="topic" required>
                            <div class="form-text">Nome ou título da sua reunião</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="agenda" class="form-label">Descrição</label>
                            <textarea class="form-control bg-dark text-light border-secondary" id="agenda" name="agenda" rows="3"></textarea>
                            <div class="form-text">Descrição ou pauta da reunião (opcional)</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="start_time" class="form-label">Data e Hora de Início</label>
                            <input type="datetime-local" class="form-control bg-dark text-light border-secondary" id="start_time" name="start_time" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="duration" class="form-label">Duração (minutos)</label>
                            <input type="number" class="form-control bg-dark text-light border-secondary" id="duration" name="duration" value="60" min="15" max="240" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="timezone" class="form-label">Fuso Horário</label>
                            <select class="form-select bg-dark text-light border-secondary" id="timezone" name="timezone">
                                <option value="America/Sao_Paulo">América/São Paulo (BRT)</option>
                                <option value="America/New_York">América/Nova York (EST)</option>
                                <option value="Europe/London">Europa/Londres (GMT)</option>
                                <option value="UTC">UTC</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label d-block">Configurações</label>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="host_video" name="host_video" checked>
                                <label class="form-check-label" for="host_video">Iniciar com vídeo do anfitrião</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="participant_video" name="participant_video" checked>
                                <label class="form-check-label" for="participant_video">Iniciar com vídeo dos participantes</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="waiting_room" name="waiting_room" checked>
                                <label class="form-check-label" for="waiting_room">Sala de espera ativada</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="auto_recording" name="auto_recording">
                                <label class="form-check-label" for="auto_recording">Gravar automaticamente</label>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-calendar-plus me-2"></i> Criar Reunião
                            </button>
                            <a href="/zoom_api/" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
