<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard Estratégico - Fintechs{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- CSS Customizados para Dashboards Fintechs -->
    <link href="{{ url_for('static', filename='css/fintech-strategic-dashboards.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/fintech-dark-theme.css') }}" rel="stylesheet">
    
    {% block extra_styles %}{% endblock %}
</head>
<body class="dark-theme">
    {% block content %}{% endblock %}
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Client Validation Script -->
    <script src="{{ url_for('static', filename='js/client-validation.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
