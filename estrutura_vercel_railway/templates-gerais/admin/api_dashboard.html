<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de APIs - Sistema Jurídico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #21333d;
            --bg-secondary: #355d69;
            --text-light: #e8f4f8;
            --accent-green: #4CAF50;
            --accent-red: #f44336;
            --accent-orange: #ff9800;
            --accent-blue: #2196F3;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .api-card {
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .api-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-active {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .status-inactive {
            background: var(--accent-red);
        }

        .provider-selector {
            background: var(--bg-primary);
            border: 1px solid var(--bg-secondary);
            color: var(--text-light);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .test-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .btn-primary-custom {
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            background: #1976D2;
            transform: translateY(-1px);
        }

        .response-area {
            background: var(--bg-primary);
            border: 1px solid var(--bg-secondary);
            border-radius: 8px;
            padding: 1rem;
            min-height: 150px;
            color: var(--text-light);
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .model-badge {
            background: var(--accent-green);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 0.25rem;
            display: inline-block;
        }

        .transcription-badge {
            background: var(--accent-orange);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 0.25rem;
            display: inline-block;
        }

        .provider-type {
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="mb-0">
                        <i class="fas fa-robot"></i>
                        Dashboard de APIs de IA
                    </h1>
                    <a href="/" class="btn btn-outline-light">
                        <i class="fas fa-home"></i>
                        Home
                    </a>
                </div>
            </div>
        </div>

        <!-- Statistics Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalProviders">-</div>
                <div>Total de Provedores</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="activeProviders">-</div>
                <div>Provedores Ativos</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="primaryProvider">-</div>
                <div>Provedor Primário</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lastUpdate">-</div>
                <div>Última Atualização</div>
            </div>
        </div>

        <!-- API Providers -->
        <div class="row">
            <div class="col-12">
                <h3 class="mb-3">Status dos Provedores</h3>
                <div id="providersContainer">
                    <!-- Providers will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Test Panel -->
        <div class="test-panel">
            <h4 class="mb-3">
                <i class="fas fa-flask"></i>
                Testar APIs
            </h4>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Provedor:</label>
                        <select class="form-select provider-selector" id="testProvider">
                            <option value="">Automático (Melhor Disponível)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Teste:</label>
                        <select class="form-select provider-selector" id="testType">
                            <option value="simple">Teste Simples</option>
                            <option value="legal">Análise Jurídica</option>
                            <option value="sentiment">Análise de Sentimento</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pergunta/Texto:</label>
                        <textarea class="form-control provider-selector" id="testQuery" rows="3" 
                                  placeholder="Digite sua pergunta ou texto para análise..."></textarea>
                    </div>
                    <button class="btn btn-primary-custom" onclick="testAPI()">
                        <i class="fas fa-play"></i>
                        Executar Teste
                    </button>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Resposta:</label>
                    <div class="response-area" id="testResponse">
                        Clique em "Executar Teste" para ver a resposta...
                    </div>
                    <div class="mt-2">
                        <small class="text-muted">
                            <span id="responseTime"></span>
                            <span id="tokenCount"></span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentStatus = null;

        // Load API status on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadAPIStatus();
            setInterval(loadAPIStatus, 30000); // Refresh every 30 seconds
        });

        async function loadAPIStatus() {
            try {
                const response = await fetch('/api/chat/status');
                const data = await response.json();
                
                if (data.success) {
                    currentStatus = data;
                    updateDashboard(data);
                }
            } catch (error) {
                console.error('Erro ao carregar status:', error);
            }
        }

        function updateDashboard(data) {
            // Update statistics
            document.getElementById('totalProviders').textContent = data.status.total_providers;
            document.getElementById('activeProviders').textContent = data.status.available_providers;
            document.getElementById('primaryProvider').textContent = data.summary.primary_provider || 'N/A';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('pt-BR');

            // Update providers container
            const container = document.getElementById('providersContainer');
            container.innerHTML = '';

            Object.entries(data.status.providers).forEach(([providerId, config]) => {
                const card = createProviderCard(providerId, config);
                container.appendChild(card);
            });

            // Update test provider options
            updateTestProviderOptions(data.status.providers);
        }

        function createProviderCard(providerId, config) {
            const card = document.createElement('div');
            card.className = 'api-card';
            
            const statusClass = config.available ? 'status-active' : 'status-inactive';
            const statusText = config.available ? 'Ativo' : 'Inativo';
            const isTranscription = providerId === 'assemblyai';
            const badgeClass = isTranscription ? 'transcription-badge' : 'model-badge';
            const providerType = isTranscription ? 'Transcrição' : 'Chat/Análise';
            
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h5 class="mb-2">
                            <span class="status-indicator ${statusClass}"></span>
                            ${config.name}
                        </h5>
                        <div class="provider-type">
                            <i class="fas ${isTranscription ? 'fa-microphone' : 'fa-brain'}"></i>
                            ${providerType}
                        </div>
                        <p class="mb-2 text-muted">Status: ${statusText}</p>
                        <p class="mb-2">
                            <strong>Modelo Padrão:</strong> 
                            <span class="${badgeClass}">${config.default_model}</span>
                        </p>
                        ${isTranscription ? `
                        <p class="mb-2">
                            <strong>Recursos:</strong><br>
                            <span class="transcription-badge">Speaker Diarization</span>
                            <span class="transcription-badge">Análise de Sentimento</span>
                            <span class="transcription-badge">Timestamps</span>
                        </p>
                        ` : ''}
                    </div>
                    <div class="text-end">
                        <div class="badge ${config.enabled ? 'bg-success' : 'bg-danger'}">
                            ${config.enabled ? 'Configurado' : 'Não Configurado'}
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        function updateTestProviderOptions(providers) {
            const select = document.getElementById('testProvider');
            
            // Clear existing options except the first one
            while (select.children.length > 1) {
                select.removeChild(select.lastChild);
            }

            Object.entries(providers).forEach(([providerId, config]) => {
                if (config.available) {
                    const option = document.createElement('option');
                    option.value = providerId;
                    option.textContent = config.name;
                    select.appendChild(option);
                }
            });
        }

        async function testAPI() {
            const provider = document.getElementById('testProvider').value || null;
            const testType = document.getElementById('testType').value;
            const query = document.getElementById('testQuery').value;
            
            if (!query.trim()) {
                alert('Por favor, digite uma pergunta ou texto para testar.');
                return;
            }

            const responseArea = document.getElementById('testResponse');
            const responseTime = document.getElementById('responseTime');
            const tokenCount = document.getElementById('tokenCount');
            
            responseArea.textContent = 'Processando...';
            responseTime.textContent = '';
            tokenCount.textContent = '';

            const startTime = Date.now();

            try {
                let endpoint, payload;
                
                if (testType === 'simple') {
                    endpoint = '/api/chat/juridico';
                    payload = {
                        query: query,
                        provider: provider,
                        area_juridica: 'geral'
                    };
                } else {
                    endpoint = '/api/chat/analyze';
                    payload = {
                        text: query,
                        provider: provider,
                        type: testType === 'sentiment' ? 'sentiment' : 'legal'
                    };
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const endTime = Date.now();
                const duration = (endTime - startTime) / 1000;

                if (data.success) {
                    responseArea.textContent = data.response || JSON.stringify(data, null, 2);
                    responseTime.textContent = `⏱️ ${duration.toFixed(2)}s`;
                    
                    if (data.tokens_used) {
                        tokenCount.textContent = ` | 🎯 ${data.tokens_used} tokens`;
                    }
                    
                    if (data.provider) {
                        tokenCount.textContent += ` | 🤖 ${data.provider}`;
                    }
                } else {
                    responseArea.textContent = `Erro: ${data.error}`;
                    responseTime.textContent = `❌ ${duration.toFixed(2)}s`;
                }
            } catch (error) {
                const endTime = Date.now();
                const duration = (endTime - startTime) / 1000;
                
                responseArea.textContent = `Erro de conexão: ${error.message}`;
                responseTime.textContent = `❌ ${duration.toFixed(2)}s`;
            }
        }
    </script>
</body>
</html>
