[project]
name = "legal-pro"
version = "2.0.0"
description = "Advanced multi-agent AI system for legal practice"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.0",
    "gunicorn>=22.0.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.23",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.1.1",
    "Werkzeug>=3.0.1",
    "openai>=1.54.4",
    "google-generativeai>=0.8.3",
    "anthropic>=0.40.0",
    "qdrant-client>=1.13.1",
    "python-docx>=1.1.2",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "gtts>=2.5.4",
    "reportlab>=4.4.0",
    "requests>=2.32.3",
    "diff-match-patch>=20240709",
    "psutil>=6.1.0",
    "Flask-Limiter>=3.8.0",
    "colorama>=0.4.6",
    "numpy>=1.26.4",
    "pydub>=0.25.1",
    "schedule>=1.2.2",
    "tqdm>=4.67.1",
    "assemblyai>=0.40.2",
    "google-genai>=1.21.1",
    "scikit-learn>=1.7.0",
    "pandas>=2.2.3",
    "joblib>=1.5.1",
    "plotly>=6.2.0",
    "torch",
    "torchaudio",
    "whisper>=1.1.10",
    "openai-whisper>=20240930",
    "textblob>=0.19.0",
    "vadersentiment>=3.3.2",
    "soundfile>=0.13.1",
    "transformers>=4.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"