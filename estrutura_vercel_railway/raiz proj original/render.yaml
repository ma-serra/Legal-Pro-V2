services:
  - type: web
    name: legal-design-pro-v2
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-render.txt || pip install -r requirements.txt
      mkdir -p logs uploads temp static/exports templates
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 300 --worker-class sync --max-requests 1000 --max-requests-jitter 100 --preload main:app
    plan: starter
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: PORT
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: False