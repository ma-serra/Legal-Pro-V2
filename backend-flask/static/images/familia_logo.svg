<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo branco -->
  <rect width="64" height="64" fill="#FFFFFF" stroke="#FFD700" stroke-width="2" rx="8"/>
  
  <!-- Família - 3 bonequinhos em dourado -->
  <!-- Pai (esquerda) -->
  <g fill="#FFD700">
    <!-- Cabeça do pai -->
    <circle cx="16" cy="20" r="6"/>
    <!-- Corpo do pai -->
    <rect x="12" y="26" width="8" height="12" rx="2"/>
    <!-- Braços do pai -->
    <rect x="8" y="28" width="4" height="8" rx="2"/>
    <rect x="20" y="28" width="4" height="8" rx="2"/>
    <!-- Pernas do pai -->
    <rect x="13" y="38" width="2.5" height="10" rx="1"/>
    <rect x="16.5" y="38" width="2.5" height="10" rx="1"/>
  </g>
  
  <!-- Mãe (direita) -->
  <g fill="#FFD700">
    <!-- Cabeça da mãe -->
    <circle cx="48" cy="20" r="6"/>
    <!-- Cabelo da mãe (mais longo) -->
    <path d="M42 16 Q42 12 48 12 Q54 12 54 16 Q54 20 48 24 Q42 20 42 16" fill="#FFD700"/>
    <!-- Corpo da mãe -->
    <rect x="44" y="26" width="8" height="12" rx="2"/>
    <!-- Braços da mãe -->
    <rect x="40" y="28" width="4" height="8" rx="2"/>
    <rect x="52" y="28" width="4" height="8" rx="2"/>
    <!-- Pernas da mãe -->
    <rect x="45" y="38" width="2.5" height="10" rx="1"/>
    <rect x="48.5" y="38" width="2.5" height="10" rx="1"/>
  </g>
  
  <!-- Criança (centro, menor) -->
  <g fill="#FFD700">
    <!-- Cabeça da criança -->
    <circle cx="32" cy="24" r="5"/>
    <!-- Corpo da criança -->
    <rect x="29" y="29" width="6" height="10" rx="2"/>
    <!-- Braços da criança -->
    <rect x="26" y="31" width="3" height="6" rx="1.5"/>
    <rect x="35" y="31" width="3" height="6" rx="1.5"/>
    <!-- Pernas da criança -->
    <rect x="30" y="39" width="2" height="8" rx="1"/>
    <rect x="32" y="39" width="2" height="8" rx="1"/>
  </g>
  
  <!-- Coração simbolizando união familiar -->
  <path d="M32 52 C28 48 20 44 24 38 C26 36 30 38 32 42 C34 38 38 36 40 38 C44 44 36 48 32 52 Z" fill="#FFD700" opacity="0.7"/>
</svg>