<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Transcrição - Legal Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3b576f;
            --secondary-color: #47b6b5;
            --dark-bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-light: #e0e0e0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .processing-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }

        .processing-icon {
            font-size: 4rem;
            color: var(--secondary-color);
            animation: spin 2s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .processing-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .processing-message {
            color: rgba(224, 224, 224, 0.8);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .progress-bar-container {
            background: #404040;
            border-radius: 25px;
            padding: 8px;
            margin-bottom: 30px;
        }

        .progress-bar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            height: 25px;
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            width: 10%;
        }

        .processing-details {
            background: rgba(71, 182, 181, 0.1);
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="processing-card">
        <i class="fas fa-sync-alt processing-icon"></i>
        <h1 class="processing-title">Processando com Whisper</h1>
        <p class="processing-message">Transcrição inteligente com diarização e análise de sentimento</p>
        
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar">
                <span id="progressPercentage">10%</span>
            </div>
        </div>
        
        <div class="processing-details">
            <p><strong>Arquivo:</strong> {{ filename or 'audio.mp3' }}</p>
            <p><strong>Método:</strong> OpenAI Whisper + IA Avançada</p>
            <p><strong>Funcionalidades:</strong> Diarização, Timestamps, Sentimento</p>
        </div>
    </div>

    <script>
        const transcriptId = '{{ transcript_id }}';
        let progress = 10;

        // Simular progresso inicial
        setTimeout(() => {
            updateProgress(30, 'Analisando áudio...');
        }, 2000);

        setTimeout(() => {
            updateProgress(60, 'Processando com Whisper...');
        }, 5000);

        setTimeout(() => {
            updateProgress(80, 'Aplicando diarização...');
        }, 8000);

        setTimeout(() => {
            updateProgress(95, 'Análise de sentimento...');
        }, 11000);

        setTimeout(() => {
            // Redirecionar para resultado
            window.location.href = `/transcricao-audio/result/${transcriptId}`;
        }, 15000);

        function updateProgress(percentage, message) {
            document.getElementById('progressPercentage').textContent = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
            
            if (message) {
                document.querySelector('.processing-message').textContent = message;
            }
        }

        // Verificar status real se disponível
        if (transcriptId && transcriptId !== '') {
            checkRealStatus();
        }

        async function checkRealStatus() {
            try {
                const response = await fetch(`/transcricao-audio/status/${transcriptId}`);
                const result = await response.json();

                if (result.success) {
                    updateProgress(result.progress || 50, result.message || 'Processando...');

                    if (result.status === 'completed') {
                        updateProgress(100, 'Concluído!');
                        setTimeout(() => {
                            window.location.href = `/transcricao-audio/result/${transcriptId}`;
                        }, 1000);
                    } else if (result.status === 'error') {
                        document.querySelector('.processing-message').textContent = 'Erro: ' + result.error;
                        document.querySelector('.processing-icon').className = 'fas fa-exclamation-triangle processing-icon';
                    } else {
                        // Continue verificando
                        setTimeout(checkRealStatus, 3000);
                    }
                }
            } catch (error) {
                console.error('Erro ao verificar status:', error);
                setTimeout(checkRealStatus, 5000);
            }
        }
    </script>
</body>
</html>
