<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Jurídico IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #21333d !important;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Cor dos card-body */
        .card-body {
            background-color: #575b5c !important;
            color: #ffffff !important;
        }
        
        /* Cores dos textos dos cards */
        .card-text {
            color: #768082 !important;
        }
        
        .text-muted {
            color: #ffffff !important;
        }
        
        .card-title {
            color: #fcfffb !important;
        }
        
        /* Cores dos botões e elementos */
        .btn-sm {
            background-color: #355d6c !important;
            border-color: #355d6c !important;
        }
        
        .agent-icon {
            color: #355d6c !important;
        }
        
        .form-group {
            background-color: #575b5c !important;
        }
        
        .form-label {
            color: #575b5c !important;
        }
        
        /* Cor dos elementos d-flex */
        .d-flex {
            color: #355d6c !important;
        }
        
        /* Cor dos card-header */
        .card-header {
            background-color: #355d6c !important;
            color: #ffffff !important;
        }
        
        /* Cor dos agent-icon */
        .agent-icon {
            color: #40aba0 !important;
        }
        
        /* Cor dos form-text */
        .form-text {
            color: #40aba0 !important;
        }
        
        /* Cor dos file-upload e btn-sm */
        .file-upload, .btn-sm {
            background-color: #40aba0 !important;
            border-color: #40aba0 !important;
            color: #ffffff !important;
        }
        
        /* Cor dos form-check-label */
        .form-check-label {
            color: #40a9a3 !important;
        }
        
        /* Cor dos form-check-input checked */
        .form-check-input:checked {
            background-color: #40a9a3 !important;
            border-color: #40a9a3 !important;
        }
        
        /* Adiciona margem aos form-check-input */
        .form-check-input {
            margin: 0.125rem !important;
        }
        
        /* Nav tabs personalizadas */
        .nav-tabs .nav-link.active {
            border-bottom: 3px solid #336b69 !important;
            background-color: transparent !important;
            color: #ffffff !important;
        }
        
        /* Cor dos ícones drag-and-drop */
        .drag-and-drop i, .file-drop-zone i, .upload-icon, 
        .fa-upload, .fa-file-upload, .fa-cloud-upload-alt {
            color: #40a9a3 !important;
        }
        
        /* Cor dos border-bottom */
        .border-bottom, .card-header, .nav-tabs, .dropdown-divider,
        hr, .modal-header, .table-bordered th, .table-bordered td {
            border-bottom-color: #fcfffb !important;
        }
        
        /* Hover do drag-and-drop */
        .drag-and-drop:hover, .file-drop-zone:hover, 
        .upload-area:hover, .file-upload-area:hover {
            border-color: #355d6c !important;
            background-color: rgba(52, 104, 102, 0.1) !important;
        }
        
        /* Alert-info customizado */
        .alert-info {
            --bs-alert-color: #fcfffb;
            --bs-alert-bg: #355d6c;
            --bs-alert-border-color: #355d6c;
            border-left: 4px solid #355d6c !important;
            color: #fcfffb !important;
        }
        
        .alert-info h1, .alert-info h2, .alert-info h3, .alert-info h4, .alert-info h5, .alert-info h6,
        .alert-info .alert-heading {
            color: #fcfffb !important;
        }
        
        .alert-info i, .alert-info .icon, .alert-info .fa, .alert-info [class*="fa-"] {
            color: #fcfffb !important;
        }
        
        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #2d3748, #4a5568);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .config-panel {
            background: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .messages-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #ffffff;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }
        
        .message-user {
            justify-content: flex-end;
        }
        
        .message-assistant {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .message-user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: 15px;
        }
        
        .message-assistant .message-content {
            background: #f1f3f4;
            color: #333;
            margin-right: 15px;
        }
        
        .message-info {
            font-size: 11px;
            color: #6c757d;
            margin-top: 4px;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            background-color: #999;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-1px);
        }
        
        .empty-chat-message {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="chat-container">
            <!-- Cabeçalho -->
            <div class="chat-header d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="mb-0">
                        <i class="fas fa-robot me-2"></i>
                        Assistente Jurídico IA
                    </h4>
                    <small class="opacity-75">Especialista em questões jurídicas</small>
                </div>
                <div>
                    <a href="/" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-home me-1"></i> Home
                    </a>
                </div>
            </div>
            
            <!-- Painel de Configurações -->
            <div class="config-panel">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="modelo_llm" class="form-label small">
                            <i class="fas fa-brain"></i> Modelo
                        </label>
                        <select id="modelo_llm" class="form-select form-select-sm">
                            <option value="openai/gpt-4o">GPT-4o</option>
                            <option value="anthropic/claude-sonnet-4-20250514">Claude 4 Sonnet (Mais recente)</option>
                            <option value="anthropic/claude-3-7-sonnet-20250219">Claude 3.7 Sonnet (Avançado)</option>
                            <option value="anthropic/claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                            <option value="deepseek/deepseek-chat">DeepSeek Chat</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="personalidade" class="form-label small">
                            <i class="fas fa-user-tie"></i> Personalidade
                        </label>
                        <select id="personalidade" class="form-select form-select-sm">
                            <option value="advogado">Advogado</option>
                            <option value="juiz">Juiz</option>
                            <option value="professor">Professor</option>
                            <option value="promotor">Promotor</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="tom_voz" class="form-label small">
                            <i class="fas fa-volume-up"></i> Tom
                        </label>
                        <select id="tom_voz" class="form-select form-select-sm">
                            <option value="natural">Natural</option>
                            <option value="objetivo">Objetivo</option>
                            <option value="sistemático">Sistemático</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Área de Mensagens -->
            <div id="messages" class="messages-container">
                <div class="empty-chat-message">
                    <i class="fas fa-comments fa-3x mb-3 text-muted"></i>
                    <p>Olá! Sou seu assistente jurídico especializado.<br>
                    Como posso ajudá-lo hoje?</p>
                </div>
            </div>
            
            <!-- Área de Input -->
            <div class="input-container">
                <form id="chatForm">
                    <input type="hidden" name="conversa_id" value="{{ conversa_id or 'nova' }}">
                    <div class="input-group">
                        <input type="text" 
                               id="userInput" 
                               name="mensagem" 
                               class="form-control" 
                               placeholder="Digite sua pergunta jurídica..."
                               autocomplete="off">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <input type="file" 
                               id="fileUpload" 
                               class="form-control form-control-sm" 
                               accept=".pdf,.doc,.docx,.txt">
                        <small class="text-muted">Envie documentos para análise (PDF, DOC, DOCX, TXT)</small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('assistente.static', filename='js/chat-fixed.js') }}"></script>
</body>
</html>
