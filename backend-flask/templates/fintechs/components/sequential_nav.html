<!-- Navegação Sequencial entre Dashboards -->
{% if navigation %}
<div class="row mt-4">
    <div class="col-12 text-center">
        <!-- Botão Voltar aos Dashboards (sempre presente) -->
        <a href="/fintechs/strategic-dashboards" 
           class="btn btn-outline-primary btn-lg me-3"
           data-testid="button-back-dashboards">
            <i class="fas fa-arrow-left me-2"></i>Voltar aos Dashboards
        </a>
        
        <!-- Botão Anterior (se houver dashboard anterior) -->
        {% if navigation.previous %}
        <a href="/fintechs/strategic-dashboards/{{ navigation.previous.slug }}" 
           class="btn btn-secondary btn-lg me-3"
           data-testid="button-previous-dashboard">
            <i class="fas fa-chevron-left me-2"></i>Anterior: {{ navigation.previous.title }}
        </a>
        {% endif %}
        
        <!-- Botão Próximo (se houver dashboard próximo) -->
        {% if navigation.next %}
        <a href="/fintechs/strategic-dashboards/{{ navigation.next.slug }}" 
           class="btn btn-primary btn-lg"
           data-testid="button-next-dashboard">
            Próximo: {{ navigation.next.title }}<i class="fas fa-chevron-right ms-2"></i>
        </a>
        {% endif %}
    </div>
</div>
{% endif %}
