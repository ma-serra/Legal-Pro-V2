validacao:
  embargo_days: 30
  janela_drift: 90
  threshold_alerta_drift: 0.05

segmentacao:
  areas_ativas: ['trabalhista', 'civil', 'consumidor', 'tributario']
  fallback_modelo_geral: true

monitoramento:
  freq_verificacao_drift: 'diaria'
  salvar_metricas: true
  
performance:
  cache_modelos: true
  timeout_operacoes: 30
  processamento_lote: true