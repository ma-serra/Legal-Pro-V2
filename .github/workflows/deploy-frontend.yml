name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - copilot/prepare-for-deployment
    paths:
      - 'frontend-react/frontend-react/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-react/frontend-react/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend-react/frontend-react
        run: npm ci
      
      - name: Build
        working-directory: frontend-react/frontend-react
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://legal-pro-saas.up.railway.app' }}
        run: npm run build
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend-react/frontend-react
          vercel-args: '--prod'
